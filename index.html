<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ค้นหาโต๊ะของคุณ — งานแต่งงาน</title>
<meta name="description" content="ค้นหาชื่อของคุณเพื่อดูว่านั่งโต๊ะไหนในงาน">
<meta name="theme-color" content="#a88544">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <header class="hero" id="hero">
    <div class="hero-mark">Wedding Seating</div>
    <h1 id="coupleName">ผังที่นั่งในงาน</h1>
    <p id="venueLine">VIVACE สาขาบางปู</p>
    <div class="hero-rule"></div>
  </header>

  <!-- ปุ่มย้อนกลับ — โผล่ทุกหน้ายกเว้นหน้าแรก -->
  <button class="backbar no-print" id="backBar" hidden>← ย้อนกลับ</button>

  <div id="status"></div>

  <!-- ══ หน้าแรก: ค้นหา + เลือกฝั่ง ══ -->
  <section id="homeView" hidden>
    <div class="search-box">
      <input id="q" type="search" inputmode="search" autocomplete="off"
             enterkeyhint="search" placeholder="พิมพ์ชื่อของคุณ…" aria-label="ค้นหาชื่อ">
      <button class="clear" id="clearBtn" type="button" aria-label="ล้างคำค้น" hidden>×</button>
    </div>
    <p class="hint">พิมพ์ชื่อจริง ชื่อเล่น หรือชื่อกลุ่มก็ได้ — สะกดไม่ตรงเป๊ะก็ยังหาเจอ</p>

    <div class="results" id="results"></div>

    <div class="empty-state" id="idle">
      <!-- ช่อดอกไม้เส้นทอง วาดเป็น SVG แทนอิโมจิ 💐
           อิโมจิถูกวาดโดยผู้ผลิตมือถือแต่ละเจ้า จะคุมสีให้เข้าธีมไม่ได้เลย
           และหน้าตาต่างกันคนละแบบระหว่าง iPhone / Android / Windows -->
      <svg class="ornament" viewBox="0 0 100 96" aria-hidden="true">
        <defs>
          <linearGradient id="orn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c9a961"/>
            <stop offset="1" stop-color="#8a6c2e"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#orn)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M50 92 V 34"/>
          <g>
            <path d="M50 78 C 41 77 33 70 30 61 C 40 62 48 69 50 78 Z"/>
            <path d="M50 64 C 42 63 35 57 32 49 C 41 50 48 56 50 64 Z"/>
            <path d="M50 51 C 44 50 38 45 36 39 C 43 40 48 45 50 51 Z"/>
          </g>
          <g transform="matrix(-1,0,0,1,100,0)">
            <path d="M50 78 C 41 77 33 70 30 61 C 40 62 48 69 50 78 Z"/>
            <path d="M50 64 C 42 63 35 57 32 49 C 41 50 48 56 50 64 Z"/>
            <path d="M50 51 C 44 50 38 45 36 39 C 43 40 48 45 50 51 Z"/>
          </g>
          <g transform="translate(50,26)">
            <ellipse rx="3.1" ry="6.3" cy="-8"/>
            <ellipse rx="3.1" ry="6.3" cy="-8" transform="rotate(72)"/>
            <ellipse rx="3.1" ry="6.3" cy="-8" transform="rotate(144)"/>
            <ellipse rx="3.1" ry="6.3" cy="-8" transform="rotate(216)"/>
            <ellipse rx="3.1" ry="6.3" cy="-8" transform="rotate(288)"/>
            <circle r="3.4"/>
          </g>
        </g>
      </svg>
      <p>ยินดีต้อนรับสู่งานของเรา</p>
    </div>

    <!-- ทางเลือกสำหรับคนที่ไม่อยากพิมพ์ — จิ้มเลือกฝั่งแล้วไล่ดูโต๊ะเอา -->
    <div id="browsePrompt">
      <div class="or-line">หรือไม่ต้องพิมพ์ — เลือกฝั่งของคุณ</div>
      <div class="side-pick">
        <button class="side-btn bride" data-pick="bride">
          <span class="ico">👰</span>
          <span class="t">ฝั่งเจ้าสาว</span>
          <span class="s" id="brideSub"></span>
        </button>
        <button class="side-btn groom" data-pick="groom">
          <span class="ico">🤵</span>
          <span class="t">ฝั่งเจ้าบ่าว</span>
          <span class="s" id="groomSub"></span>
        </button>
      </div>
    </div>

    <nav class="mini-nav no-print">
      <a href="#" id="showMapLink">ดูแผนผังทั้งงาน</a>
    </nav>
  </section>

  <!-- ══ หน้าเนื้อหา (รายการโต๊ะ / โต๊ะ / แขก) ══ -->
  <section id="pageView" hidden></section>

  <!-- ══ แผนผัง ══ -->
  <section id="mapSection" hidden>
    <div class="map-holder" id="mapHolder"></div>
    <!-- เดิมเป็นแค่คำอธิบายสี แต่มันหน้าตาเหมือนปุ่มจนคนพยายามกด
         เลยทำให้กดได้จริงเป็นตัวกรองแทน — ของที่ดูกดได้ต้องกดได้ -->
    <div class="map-filters" id="mapFilters"></div>
    <p class="map-filter-hint">แตะเพื่อกรองโต๊ะบนแผนผัง · แตะซ้ำเพื่อยกเลิก</p>
  </section>

  <p class="foot" id="foot"></p>

</div>

<!-- ปุ่มลอยสำหรับโหมด iPad ตั้งโชว์ — แขกคนถัดไปกดเริ่มใหม่ได้เองโดยไม่ต้องหาปุ่มย้อนกลับ -->
<button class="restart no-print" id="restartBtn" hidden>⟲ เริ่มใหม่</button>

<script src="js/core.js"></script>
<script src="js/seatmap.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   หน้าแขก

   การนำทางผูกกับ URL ทั้งหมด:
     (ว่าง)        → หน้าแรก
     ?side=bride   → รายการโต๊ะของฝั่งนั้น
     ?t=23         → รายละเอียดโต๊ะ
     ?g=<id>       → ที่นั่งของแขกคนนั้น (ลิงก์ส่วนตัว)

   ทำแบบนี้เพื่อให้ **ปุ่ม Back ของมือถือใช้ได้จริง** ไม่ใช่เด้งออกจากเว็บ
   ซึ่งสำคัญมากหน้างาน เพราะแขกส่วนใหญ่กดปุ่ม Back ของเครื่องก่อนเสมอ
   ปุ่ม "← ย้อนกลับ" บนหน้าเว็บก็เรียก history.back() ตัวเดียวกัน
═══════════════════════════════════════════════════════════════ */

let DATA  = { tables: [], guests: [] };
let INDEX = [];

let MAP_FILTER = '';   // '' | 'bride' | 'groom' | 'free' | 'full'
let MAP_HI     = 0;    // เลขโต๊ะที่ไฮไลต์อยู่ ใช้วาดแผนผังซ้ำตอนสลับตัวกรอง

const $ = function (id) { return document.getElementById(id); };

/* ── โหมด Kiosk (iPad ตั้งโชว์หน้างาน) ────────────────────────

   เปิดครั้งเดียวด้วย ?kiosk=1 แล้วจำไว้ใน localStorage
   (ไม่ใช้ sessionStorage เพราะ iPad ที่เพิ่มเว็บลงหน้าจอโฮมแล้วปิด-เปิดใหม่
    sessionStorage จะหาย แล้วโหมดจะหลุดเงียบ ๆ โดยไม่มีใครรู้)

   ปิดด้วย ?kiosk=0 — มือถือทีมงานที่เปิดลิงก์ปกติจะไม่โดนผลกระทบ

   แก้ 2 ปัญหาของการตั้งเครื่องทิ้งไว้:
     1. หน้าจอค้างผลของคนก่อนหน้า → ไม่มีใครแตะ 30 วิ เด้งกลับหน้าแรกเอง
     2. จอ iPad ดับเอง → ขอ Wake Lock ไว้                                  */

const KIOSK = (function () {
  try {
    const p = new URLSearchParams(location.search).get('kiosk');
    if (p === '1') localStorage.setItem('kiosk', '1');
    if (p === '0') localStorage.removeItem('kiosk');
    // ล้าง ?kiosk ออกจาก URL ทันที ไม่ให้ไปปนกับ route จริง (?t= ?g= ?side=)
    if (p !== null) history.replaceState({ d: 0 }, '', location.pathname);
    return localStorage.getItem('kiosk') === '1';
  } catch (e) {
    return false;   // โหมดส่วนตัว/ปิด storage — ถือว่าไม่ใช่ kiosk
  }
})();

const IDLE_MS = 30000;   // 30 วิ — ตัวจับเวลาเริ่มนับใหม่ทุกครั้งที่แตะหรือเลื่อนจอ
let idleTimer = null;
let wakeLock = null;

function armIdle() {
  if (!KIOSK) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(resetKiosk, IDLE_MS);
}

function resetKiosk() {
  els.q.value = '';
  els.clear.hidden = true;
  navigate('', true);   // replace ไม่ push — ประวัติจะได้ไม่บวมตลอดงาน
}

/** กันจอ iPad ดับระหว่างงาน — ต้องขอใหม่ทุกครั้งที่กลับมาเห็นหน้าจอ */
async function keepAwake() {
  if (!KIOSK || !('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) {
    // เบราว์เซอร์ไม่รองรับ หรือแบตโหมดประหยัด — ไม่ใช่เรื่องคอขาดบาดตาย
    // สำรองไว้: ตั้ง "ล็อกอัตโนมัติ: ไม่เลย" ใน Settings ของ iPad
  }
}

const els = {
  hero: $('hero'), back: $('backBar'), status: $('status'),
  home: $('homeView'), page: $('pageView'),
  q: $('q'), clear: $('clearBtn'), results: $('results'), idle: $('idle'),
  prompt: $('browsePrompt'), mapSec: $('mapSection'), map: $('mapHolder'), foot: $('foot')
};

/* ── เริ่มต้น ─────────────────────────────────────────────── */

(async function init() {
  // เจ้าสาวขึ้นก่อนเจ้าบ่าวทั้งชื่อเล่นและชื่อจริง — Nueng กำหนดเอง
  const G = CONFIG.couple.groom, B = CONFIG.couple.bride;
  $('coupleName').textContent = (B.nick || B.name) + ' ♥ ' + (G.nick || G.name);
  document.title = 'ค้นหาโต๊ะของคุณ — งานแต่ง ' + (B.nick || B.name) + ' & ' + (G.nick || G.name);
  $('venueLine').innerHTML =
    esc(B.name) + ' &amp; ' + esc(G.name) + '<br>' +
    esc(CONFIG.venue + (CONFIG.weddingDate ? ' · ' + thaiDate(CONFIG.weddingDate) : ''));

  els.status.innerHTML = '<div class="spinner"></div>';

  try {
    DATA  = await loadData();
    INDEX = buildIndex(DATA.guests, DATA.tables);
    showSourceNote(DATA);
  } catch (err) {
    els.status.innerHTML = '<div class="notice notice-error">⚠️ ' + esc(err.message) + '</div>';
    return;
  }

  // ไม่โชว์จำนวนรายชื่อรวมด้วยเหตุผลเดียวกับป้ายใต้ปุ่มเลือกฝั่ง
  els.foot.textContent = CONFIG.totalTables + ' โต๊ะ · ' + CONFIG.venue;

  bind();
  render();
})();

/** บอกตรง ๆ เมื่อข้อมูลที่เห็นมาจาก cache ไม่ใช่ของสด — อย่าให้แขกเข้าใจผิด */
function showSourceNote(d) {
  if (d.from === 'network') { els.status.innerHTML = ''; return; }

  if (d.from === 'demo') {
    els.status.innerHTML =
      '<div class="notice notice-warn">🧪 <b>โหมดตัวอย่าง</b> — รายชื่อสมมติสำหรับดูหน้าตาเว็บ ' +
      'ยังไม่ได้เชื่อมกับ Google Sheet</div>';
    return;
  }

  const when = timeAgo(d.savedAt);
  els.status.innerHTML =
    '<div class="notice ' + (d.stale ? 'notice-warn' : 'notice-info') + '">' +
    '📶 ตอนนี้ออฟไลน์ — แสดงข้อมูลที่บันทึกไว้' + (when ? 'เมื่อ ' + esc(when) : '') +
    (d.stale ? ' ข้อมูลอาจไม่ใช่ล่าสุด' : '') + '</div>';
}

function thaiDate(iso) {
  const M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.getDate() + ' ' + M[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}

/* ── การนำทาง ─────────────────────────────────────────────── */

function navigate(qs, replace) {
  const url = qs ? location.pathname + '?' + qs : location.pathname;
  const depth = ((history.state && history.state.d) || 0) + (replace ? 0 : 1);
  history[replace ? 'replaceState' : 'pushState']({ d: depth }, '', url);
  render();
}

/**
 * ย้อนกลับหนึ่งขั้น
 * ถ้าแขกเปิดเข้ามาด้วยลิงก์ตรง (?g=... จาก LINE) จะไม่มีประวัติให้ถอย
 * กรณีนั้นพากลับหน้าแรกแทน ไม่ใช่เด้งออกจากเว็บไปหน้าอื่น
 */
function goBack() {
  if (((history.state && history.state.d) || 0) > 0) history.back();
  else navigate('', true);
}

window.addEventListener('popstate', render);

function bind() {
  els.back.addEventListener('click', goBack);

  if (KIOSK) {
    document.body.classList.add('is-kiosk');
    $('restartBtn').addEventListener('click', resetKiosk);

    // นับเวลาว่างใหม่ทุกครั้งที่มีคนแตะจอ — ไม่ใช้ click เพราะปัดเลื่อนอ่านก็ถือว่ายังใช้อยู่
    ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) {
      window.addEventListener(ev, armIdle, { passive: true });
    });

    keepAwake();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') keepAwake();
    });
  }

  let timer = null;
  els.q.addEventListener('input', function () {
    els.clear.hidden = !els.q.value;
    clearTimeout(timer);
    timer = setTimeout(runSearch, 110);
  });
  els.clear.addEventListener('click', function () {
    els.q.value = ''; els.clear.hidden = true; els.q.focus(); runSearch();
  });

  document.querySelectorAll('[data-pick]').forEach(function (b) {
    b.addEventListener('click', function () { navigate('side=' + b.dataset.pick); });
  });

  $('showMapLink').addEventListener('click', function (e) {
    e.preventDefault();
    drawMap(0);
    els.mapSec.hidden = false;
    els.mapSec.scrollIntoView({ behavior: 'smooth' });
  });
}

/** อ่าน URL แล้วแสดงหน้าที่ตรงกัน — ทางเข้าเดียวของการเปลี่ยนหน้าทั้งเว็บ */
function render() {
  const p = new URLSearchParams(location.search);
  const gid  = p.get('g');
  const t    = Number(p.get('t'));
  const side = p.get('side');

  els.home.hidden = true;
  els.page.hidden = true;
  els.mapSec.hidden = true;
  els.page.innerHTML = '';

  if (gid) {
    const g = INDEX.find(function (x) { return x.id === gid; });
    if (g) return viewGuest(g);
  }
  if (t >= 1 && t <= CONFIG.totalTables) return viewTable(t, side);
  if (side === 'bride' || side === 'groom') return viewBrowse(side);

  return viewHome();
}

function chrome(isHome) {
  els.back.hidden = isHome;
  els.hero.classList.toggle('compact', !isHome);
  // ปุ่ม "เริ่มใหม่" โผล่เฉพาะตอนหลงอยู่หน้าลึก ๆ — หน้าแรกไม่ต้องมีให้รก
  $('restartBtn').hidden = !KIOSK || isHome;
  armIdle();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── หน้าแรก ──────────────────────────────────────────────── */

function viewHome() {
  chrome(true);
  els.home.hidden = false;
  MAP_FILTER = '';   // กลับหน้าแรกแล้วเริ่มใหม่หมด ไม่ให้ตัวกรองของคนก่อนค้าง
  drawSidePick();
  runSearch();
}

/**
 * ป้ายใต้ปุ่มเลือกฝั่ง
 *
 * จงใจไม่โชว์ "จำนวนรายชื่อในระบบ" — เพราะระหว่างที่ยังกรอกรายชื่อไม่ครบ
 * ตัวเลขนั้นจะดูเหมือนจำนวนแขกจริงของฝั่งนั้น ซึ่งทำให้เข้าใจผิด
 * โชว์แค่จำนวนโต๊ะ (คงที่ เชื่อถือได้) กับยอดคนที่มาถึงแล้ว (นับจากหน้างานจริง)
 */
function drawSidePick() {
  ['bride', 'groom'].forEach(function (side) {
    const tables = tablesOfSide(side);
    const arrived = tables.reduce(function (s, t) { return s + (t.arrived || 0); }, 0);
    $(side + 'Sub').textContent = tables.length + ' โต๊ะ' +
      (arrived ? ' · มาแล้ว ' + arrived + ' คน' : '');
  });

  // ยังไม่ได้ระบุฝั่งให้โต๊ะไหนเลย → ซ่อนปุ่มไว้ ดีกว่าให้กดแล้วเจอหน้าเปล่า
  els.prompt.hidden = tablesOfSide('bride').length + tablesOfSide('groom').length === 0;
}

function tablesOfSide(side) {
  return DATA.tables.filter(function (t) { return tableSide(t.no, DATA.tables) === side; });
}

/* ── ค้นหา ────────────────────────────────────────────────── */

function runSearch() {
  const q = els.q.value.trim();

  if (!q) {
    els.results.innerHTML = '';
    els.idle.hidden = false;
    drawSidePick();
    return;
  }
  els.idle.hidden = true;
  els.prompt.hidden = true;

  const hits = searchGuests(INDEX, q, 25);

  if (!hits.length) {
    els.results.innerHTML =
      '<div class="empty-state">' +
        '<div class="big">🔍</div>' +
        '<p>ไม่พบชื่อ "' + esc(q) + '"</p>' +
        '<p style="font-size:13px">ลองพิมพ์แค่ชื่อจริง ชื่อเล่น หรือชื่อกลุ่มดูครับ<br>' +
        'หรือกดเลือกฝั่งด้านล่างเพื่อไล่ดูโต๊ะเอง</p>' +
      '</div>';
    els.prompt.hidden = false;
    return;
  }

  els.results.innerHTML = hits.map(guestCardHtml).join('');
  els.results.querySelectorAll('[data-gid]').forEach(function (btn) {
    btn.addEventListener('click', function () { navigate('g=' + encodeURIComponent(btn.dataset.gid)); });
  });
}

function guestCardHtml(g) {
  const meta = [];
  if (g.side) meta.push(SIDE_LABEL[g.side]);
  if (g.group) meta.push(g.group);

  return '' +
    '<button class="card guest-card" data-gid="' + esc(g.id) + '">' +
      '<span class="tno ' + (g.side || '') + '"><small>โต๊ะ</small>' + (g.tableNo || '?') + '</span>' +
      '<span class="guest-info">' +
        '<span class="guest-name">' + esc(g.fullName) +
          (g.nickname ? ' <span class="nick">(' + esc(g.nickname) + ')</span>' : '') +
        '</span>' +
        '<span class="guest-meta">' + esc(meta.join(' · ')) + '</span>' +
      '</span>' +
    '</button>';
}

/* ── รายการโต๊ะทีละฝั่ง ───────────────────────────────────── */

function viewBrowse(side) {
  chrome(false);

  const tables = tablesOfSide(side);
  const arrived = tables.reduce(function (s, t) { return s + (t.arrived || 0); }, 0);

  const cards = tables.map(function (t) {
    const a = t.arrived || 0;
    const full = a >= t.seats;
    return '' +
      '<button class="card guest-card table-card" data-tbl="' + t.no + '">' +
        '<span class="tno ' + side + '"><small>โต๊ะ</small>' + t.no + '</span>' +
        '<span class="guest-info">' +
          '<span class="guest-name">' + esc(t.group || 'ยังไม่ระบุกลุ่ม') + '</span>' +
          '<span class="guest-meta">' + esc(tableSummary(t.no, DATA.tables).line) + '</span>' +
        '</span>' +
        '<span class="seats' + (full ? ' is-full' : '') + '">' +
          '<b>' + a + '</b>มาแล้ว<br><small>จาก ' + t.seats + ' ที่</small></span>' +
      '</button>';
  }).join('');

  els.page.innerHTML = '' +
    '<div class="browse-head">' +
      '<h2>' + esc(SIDE_LABEL[side]) + '<br>' +
        '<span class="count">' + tables.length + ' โต๊ะ' +
        (arrived ? ' · มาแล้ว ' + arrived + ' คน' : '') + '</span></h2>' +
    '</div>' +
    '<div class="group-note">กดที่โต๊ะของคุณเพื่อดูรายละเอียดและกดแจ้งว่ามาถึงแล้ว</div>' +
    '<div class="results">' + (cards || '<div class="empty-state"><p>ยังไม่มีโต๊ะในฝั่งนี้</p></div>') + '</div>';

  els.page.hidden = false;
  els.mapSec.hidden = false;
  drawMap(0);

  els.page.querySelectorAll('[data-tbl]').forEach(function (b) {
    b.addEventListener('click', function () { navigate('t=' + b.dataset.tbl + '&side=' + side); });
  });
}

/* ── รายละเอียดโต๊ะ + ปุ่มนับหัว ──────────────────────────── */

function viewTable(no, side) {
  chrome(false);

  const meta = DATA.tables.find(function (t) { return t.no === no; }) || { seats: 10, arrived: 0 };
  const s = tableSide(no, DATA.tables);
  const p = tablePos(no);
  const mates = INDEX.filter(function (x) { return x.tableNo === no; })
                     .sort(function (a, b) { return a.fullName.localeCompare(b.fullName, 'th'); });

  els.page.innerHTML = '' +
    '<div class="found">' +
      '<div class="big-table">' + no + '</div>' +
      '<div class="big-label">โต๊ะ</div>' +
      '<div class="side-pill ' + (s || '') + '">' +
        esc([SIDE_LABEL[s], meta.group].filter(Boolean).join(' · ') || 'โต๊ะสำรอง') + '</div>' +

      (p ? '<div class="wayfind"><b>วิธีเดินไปโต๊ะ</b>' + esc(wayfinding(no)) + '</div>' : '') +

      '<div class="counter" id="counter"></div>' +

      '<div class="tablemates">' +
        // ไม่ขึ้น "0 ท่าน" ให้ดูเงียบ ๆ ตอนยังกรอกรายชื่อไม่ครบ
        '<h4>รายชื่อในโต๊ะนี้' + (mates.length ? ' ' + mates.length + ' ท่าน' : '') + '</h4>' +
        (mates.length
          ? '<ul>' + mates.map(function (m) {
              return '<li>' + esc(m.fullName) + (m.nickname ? ' (' + esc(m.nickname) + ')' : '') + '</li>';
            }).join('') + '</ul>'
          : '<p style="font-size:14px;color:var(--ink-soft)">ยังไม่มีรายชื่อในโต๊ะนี้</p>') +
      '</div>' +
    '</div>';

  els.page.hidden = false;
  els.mapSec.hidden = false;
  drawCounter(no);
  drawMap(no);
  setTimeout(function () { scrollToTable(els.map, no); }, 250);
}

/**
 * แผงนับหัว — ส่วนที่แขกกดเองหน้างาน
 * ตัวเลขต้องใหญ่และปุ่มต้องกดง่ายขณะยืนถือของ จึงใช้ปุ่มเต็มความกว้าง
 */
function drawCounter(no) {
  const t = DATA.tables.find(function (x) { return x.no === no; }) || { seats: 10, arrived: 0 };
  const a = t.arrived || 0;
  const left = Math.max(0, t.seats - a);
  const full = left === 0;
  const pct = Math.min(100, Math.round(a / (t.seats || 10) * 100));

  /* ดรอปดาวน์เลือกจำนวนแทนการกด +1 หลายครั้ง
     แต่ละครั้งที่ยิงไป Apps Script ใช้เวลา 3-4 วินาที มากันเป็นครอบครัว 4 คน
     ถ้ากดทีละคนคือยืนรอ 15 วินาทีกลางงาน — เลือกทีเดียวส่งครั้งเดียวจบ
     ตัวเลือกไม่เกินที่นั่งที่เหลือจริง จะได้ไม่เลือกไปแล้วโดนปฏิเสธทีหลัง */
  const maxAdd = Math.min(MAX_STEP, left);
  const maxSub = Math.min(MAX_STEP, a);

  const opts = function (n) {
    let o = '';
    for (let i = 1; i <= n; i++) o += '<option value="' + i + '">' + i + ' คน</option>';
    return o;
  };

  $('counter').innerHTML = '' +
    '<div class="count-head">มานั่งแล้ว</div>' +
    '<div class="count-big"><b>' + a + '</b><span>/ ' + t.seats + ' ที่</span></div>' +
    '<div class="count-bar"><i style="width:' + pct + '%"></i></div>' +
    (full
      ? '<div class="count-full">โต๊ะนี้เต็มแล้ว</div>'
      : '<div class="count-left">เหลืออีก ' + left + ' ที่</div>') +

    '<div class="count-row no-print">' +
      '<select id="addQty" aria-label="จำนวนคนที่มาถึง"' + (full ? ' disabled' : '') + '>' +
        opts(maxAdd) + '</select>' +
      '<button class="btn btn-primary" id="plusBtn"' + (full ? ' disabled' : '') + '>' +
        'มาถึงแล้ว</button>' +
    '</div>' +

    '<div class="count-row count-row-sub no-print">' +
      '<select id="subQty" aria-label="จำนวนคนที่จะลด"' + (a <= 0 ? ' disabled' : '') + '>' +
        opts(maxSub) + '</select>' +
      '<button class="btn btn-sm" id="minusBtn"' + (a <= 0 ? ' disabled' : '') + '>ลดจำนวน</button>' +
    '</div>' +

    '<p class="count-note">มากันกี่คนเลือกตรงนั้นแล้วกด "มาถึงแล้ว" ครั้งเดียว — กดผิดใช้แถวล่างแก้ได้</p>' +
    '<div id="countMsg"></div>';

  if (!full) $('plusBtn').addEventListener('click', function () {
    arrive(no, Number($('addQty').value));
  });
  if (a > 0) $('minusBtn').addEventListener('click', function () {
    arrive(no, -Number($('subQty').value));
  });
}

/**
 * ส่งยอดนับหัวไปที่เซิร์ฟเวอร์
 *
 * ส่งเป็น "ขยับทีละ 1" ไม่ใช่ส่งเลขรวมไป เพราะหลายคนกดพร้อมกันได้
 * ถ้าส่งเลขรวม คนที่กดทีหลังจะเขียนทับของคนแรกจนยอดหาย
 */
async function arrive(no, delta) {
  document.querySelectorAll('#counter button, #counter select').forEach(function (el) {
    el.disabled = true;
  });
  $('countMsg').innerHTML =
    '<div class="notice notice-info">⏳ กำลังบันทึก… อาจใช้เวลาสัก 2-3 วินาที</div>';

  try {
    const res = await postGAS({ type: 'arrive', tableNo: no, delta: delta });

    // เชื่อเลขที่เซิร์ฟเวอร์ตอบกลับ ไม่ใช่เลขที่เราเดาเอง — เผื่อมีคนอื่นกดพร้อมกัน
    const t = DATA.tables.find(function (x) { return x.no === no; });
    if (t) t.arrived = res.arrived;

    drawCounter(no);
    drawMap(no);

    const n = Math.abs(res.applied);
    let text;
    if (res.applied > 0) {
      text = '<div class="notice notice-ok">✓ บันทึก ' + n + ' คนแล้ว ยินดีต้อนรับครับ</div>';
      // ที่นั่งเหลือไม่พอกับที่เลือกไว้ — ต้องบอก ไม่ใช่เงียบแล้วให้ไปงงหน้าโต๊ะ
      if (res.applied < res.asked) {
        text += '<div class="notice notice-warn">โต๊ะเหลือแค่ ' + n +
                ' ที่ อีก ' + (res.asked - res.applied) +
                ' ท่านกรุณาแจ้งโต๊ะต้อนรับเพื่อจัดที่ให้ครับ</div>';
      }
    } else {
      text = '<div class="notice notice-info">ลดยอดลง ' + n + ' คนแล้ว</div>';
    }
    $('countMsg').innerHTML = text;

    // ข้อความเตือนเรื่องที่นั่งไม่พอ ปล่อยค้างไว้ให้อ่านทัน อย่ารีบลบ
    if (res.applied === res.asked) {
      setTimeout(function () { const m = $('countMsg'); if (m) m.innerHTML = ''; }, 3000);
    }

  } catch (err) {
    drawCounter(no);
    $('countMsg').innerHTML = '<div class="notice notice-error">' + esc(err.message) + '</div>';
  }
}

/* ── ที่นั่งของแขกรายคน ───────────────────────────────────── */

function viewGuest(g) {
  chrome(false);

  const meta = DATA.tables.find(function (t) { return t.no === g.tableNo; }) || {};
  const side = tableSide(g.tableNo, DATA.tables);
  const p = tablePos(g.tableNo);
  const mates = INDEX.filter(function (x) { return x.tableNo === g.tableNo; })
                     .sort(function (a, b) { return a.fullName.localeCompare(b.fullName, 'th'); });

  els.page.innerHTML = '' +
    '<div class="found">' +
      '<div class="who">ที่นั่งของ<strong>' + esc(g.fullName) +
        (g.nickname ? ' (' + esc(g.nickname) + ')' : '') + '</strong></div>' +

      '<div class="big-table">' + (g.tableNo || '?') + '</div>' +
      '<div class="big-label">โต๊ะ</div>' +

      '<div class="side-pill ' + (side || '') + '">' +
        esc([SIDE_LABEL[side], meta.group].filter(Boolean).join(' · ') || 'โต๊ะสำรอง') + '</div>' +

      (p ? '<div class="wayfind"><b>วิธีเดินไปโต๊ะ</b>' + esc(wayfinding(g.tableNo)) + '</div>' : '') +

      '<div class="tablemates">' +
        '<h4>ร่วมโต๊ะกับ ' + Math.max(0, mates.length - 1) + ' ท่าน</h4>' +
        '<ul>' + mates.map(function (m) {
          return '<li' + (m.id === g.id ? ' class="me"' : '') + '>' + esc(m.fullName) +
                 (m.nickname ? ' (' + esc(m.nickname) + ')' : '') + '</li>';
        }).join('') + '</ul>' +
      '</div>' +

      '<div class="btn-row no-print">' +
        '<button class="btn btn-primary" id="toTableBtn">ดูโต๊ะนี้ / แจ้งว่ามาถึง</button>' +
      '</div>' +
    '</div>';

  els.page.hidden = false;
  els.mapSec.hidden = false;
  drawMap(g.tableNo);
  setTimeout(function () { scrollToTable(els.map, g.tableNo); }, 250);

  $('toTableBtn').addEventListener('click', function () { navigate('t=' + g.tableNo); });
}

/* ── แผนผัง ───────────────────────────────────────────────── */

function drawMap(highlight) {
  MAP_HI = Number(highlight) || 0;
  renderSeatMap(els.map, {
    tables: DATA.tables,
    counts: countByTable(DATA.guests),
    highlight: MAP_HI,
    dim: !!MAP_HI,
    filter: MAP_FILTER,
    onPick: function (no) { navigate('t=' + no); }
  });
  drawFilters();
}

/**
 * แถบตัวกรองใต้แผนผัง
 *
 * "ยังมีที่ว่าง" คือตัวที่มีค่าที่สุดหน้างานจริง — เวลามีแขกมาเกิน มาผิดโต๊ะ
 * หรือมากันเป็นครอบครัวใหญ่กว่าที่จดไว้ คนที่ต้องหาที่ให้เขาจะกดปุ่มเดียวเห็นเลย
 * ไม่ต้องไล่เปิดดูทีละโต๊ะจากทั้ง 40 โต๊ะ
 */
function drawFilters() {
  const t = DATA.tables;
  const n = function (fn) { return t.filter(fn).length; };

  const chips = [
    ['bride', 'ฝั่งเจ้าสาว',  'lg-bride', n(function (x) { return tableSide(x.no, t) === 'bride'; })],
    ['groom', 'ฝั่งเจ้าบ่าว', 'lg-groom', n(function (x) { return tableSide(x.no, t) === 'groom'; })],
    ['free',  'ยังมีที่ว่าง', 'lg-free',  n(function (x) { return (x.arrived || 0) < x.seats; })],
    ['full',  'เต็มแล้ว',     'lg-done',  n(function (x) { return (x.arrived || 0) >= x.seats; })]
  ];

  $('mapFilters').innerHTML = chips.map(function (c) {
    return '<button class="chip' + (MAP_FILTER === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' +
             '<i class="' + c[2] + '"></i>' + esc(c[1]) + '<b>' + c[3] + '</b>' +
           '</button>';
  }).join('');

  $('mapFilters').querySelectorAll('[data-f]').forEach(function (b) {
    b.addEventListener('click', function () {
      MAP_FILTER = (MAP_FILTER === b.dataset.f) ? '' : b.dataset.f;   // แตะซ้ำ = ยกเลิก
      drawMap(MAP_HI);
    });
  });
}

/* ── service worker: ทำให้เปิดซ้ำได้แม้ไม่มีเน็ต ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* ไม่สำเร็จก็ยังใช้เว็บได้ปกติ */ });
  });
}
</script>
